<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shop</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

</head>

<body class="bg-gray-100">

    <!-- ================= HEADER ================= -->

    <nav class="bg-white border-gray-200 shadow">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">

            <!-- Logo -->
            <a href="#" class="flex items-center space-x-3">
                <i class="fa-solid fa-mobile-screen text-3xl text-blue-600"></i>
                <span class="self-center text-2xl font-semibold whitespace-nowrap">
                    Mobile Shop
                </span>
            </a>

            <div class="flex items-center gap-5">

                <!-- Filter -->

                <select id="filterType"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">

                    <option value="all">
                        Tất cả
                    </option>

                    <option value="Samsung">
                        Samsung
                    </option>

                    <option value="Iphone">
                        iPhone
                    </option>

                </select>

                <!-- Cart -->

                <button
                    type="button"
                    data-drawer-target="drawer-cart"
                    data-drawer-show="drawer-cart"
                    data-drawer-placement="right"
                    aria-controls="drawer-cart"
                    class="relative">

                    <i class="fa-solid fa-cart-shopping text-2xl"></i>

                    <span id="cartCount"
                        class="absolute
                        -top-2
                        -right-3
                        bg-red-500
                        text-white
                        rounded-full
                        w-5
                        h-5
                        text-xs
                        flex
                        items-center
                        justify-center">

                        0

                    </span>

                </button>

            </div>

        </div>
    </nav>

    <!-- ================= BANNER ================= -->

    <section class="bg-blue-600 text-white py-12">

        <div class="max-w-screen-xl mx-auto px-5 text-center">

            <h1 class="text-5xl font-bold mb-4">

                Mobile Shop

            </h1>

            <p class="text-xl">

                Chuyên cung cấp điện thoại chính hãng

            </p>

        </div>

    </section>

    <!-- ================= PRODUCT ================= -->

    <section class="py-10">

        <div class="max-w-screen-xl mx-auto px-5">

            <h2 class="text-3xl font-bold mb-8">

                Danh sách sản phẩm

            </h2>

            <div
                id="productList"
                class="grid
                grid-cols-1
                sm:grid-cols-2
                md:grid-cols-3
                lg:grid-cols-4
                gap-6">

                <!-- shop.js render -->

            </div>

        </div>

    </section>

    <!-- ================= DRAWER ================= -->

    <div
        id="drawer-cart"
        class="fixed top-0 right-0 z-40 h-screen p-5 overflow-y-auto transition-transform translate-x-full bg-white w-96">

        <h2 class="text-2xl font-bold mb-6">

            Giỏ hàng

        </h2>

        <div id="cartList">

            <!-- shop.js render -->

        </div>

        <hr class="my-5">

        <div class="flex justify-between text-xl font-bold">

            <span>

                Tổng tiền

            </span>

            <span id="totalPrice">

                $0

            </span>

        </div>

        <button
            id="checkoutBtn"
            class="w-full
            mt-6
            text-white
            bg-green-600
            hover:bg-green-700
            font-medium
            rounded-lg
            text-sm
            px-5
            py-3">

            Thanh toán

        </button>

    </div>

    <!-- ================= TOAST ================= -->

    <div
        id="toast-success"
        class="hidden
        fixed
        top-5
        right-5
        z-50">

        <div
            class="flex
            items-center
            p-4
            rounded-lg
            shadow
            bg-green-600
            text-white">

            <i class="fa-solid fa-circle-check mr-3"></i>

            Thanh toán thành công

        </div>

    </div>

    <!-- axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"
        integrity="sha512-h9644v03pHqrIHThkvXhB2PJ8zf5E9IyVnrSfZg8Yj8k4RsO4zldcQc4Bi9iVLUCCsqNY0b4WXVV4UB+wbWENA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- flowbite -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

    <!-- JS -->
    <script src="../js/CartItem.js"></script>
    <script src="../js/Product.js"></script>
    <script src="../js/shop.js"></script>

</body>

</html>
